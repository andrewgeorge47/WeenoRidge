# Site settings
title: Weeno Ridge Golf
description: Golf Practice Planner
baseurl: ""
url: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sass-converter

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore

# Server settings
port: 4000
host: localhost
open_url: false

# Logger settings
logger:
  level: info
  format: "%Y-%m-%d %H:%M:%S"
  output: STDOUT

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Collections
collections:
  planner:
    output: true
    permalink: /planner/:path/

# Sass settings
sass:
  style: compressed
  load_paths:
    - _sass
    - node_modules
